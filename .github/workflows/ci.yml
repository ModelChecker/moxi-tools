# This file was generated by Cursor AI on 2026-10-20.
name: CI

on:
  push:
  pull_request:

permissions:
  contents: read
  actions: write

jobs:
  test:
    name: Build and test (${{ matrix.mode }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        mode: [release, debug]
    env:
      YICES_VERSION: "2.7.0"
      YICES_PREFIX: ${{ github.workspace }}/.yices
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang gperf python3 autoconf gcc make libgmp-dev

      - name: Cache Yices
        id: cache-yices
        uses: actions/cache@v4
        with:
          path: ${{ env.YICES_PREFIX }}
          key: yices-${{ env.YICES_VERSION }}-src-${{ runner.os }}-${{ runner.arch }}

      - name: Build Yices
        if: steps.cache-yices.outputs.cache-hit != 'true'
        run: |
          git clone https://github.com/SRI-CSL/yices2.git yices2-src
          git -C yices2-src checkout "yices-${YICES_VERSION}"
          (
            cd yices2-src
            autoconf
            ./configure --prefix="$YICES_PREFIX"
            make -j"$(nproc)"
            make install
          )
          rm -rf yices2-src

      - name: Configure Yices environment
        run: |
          echo "$YICES_PREFIX/bin" >> "$GITHUB_PATH"
          echo "C_INCLUDE_PATH=$YICES_PREFIX/include" >> "$GITHUB_ENV"
          echo "LIBRARY_PATH=$YICES_PREFIX/lib" >> "$GITHUB_ENV"
          echo "LD_LIBRARY_PATH=$YICES_PREFIX/lib" >> "$GITHUB_ENV"
          echo "LDFLAGS=-L$YICES_PREFIX/lib -Wl,-rpath,$YICES_PREFIX/lib" >> "$GITHUB_ENV"

      - name: Build
        run: |
          if [ "${{ matrix.mode }}" = debug ]; then
            make -j"$(nproc)" debug
          else
            make -j"$(nproc)"
          fi

      - name: Run test suite
        run: ./test/test.sh

      - name: Build echo example
        run: |
          extra=()
          if [ "${{ matrix.mode }}" = debug ]; then
            extra=(-fsanitize=address -fsanitize=undefined)
          fi
          clang -std=c99 -Wall "${extra[@]}" \
            -Ibuild -I"$YICES_PREFIX/include" examples/echo.c \
            -Lbuild -L"$YICES_PREFIX/lib" -lmoxiparser -lyices \
            -Wl,-rpath,"$PWD/build" -Wl,-rpath,"$YICES_PREFIX/lib" \
            -o examples/echo

      - name: Run echo on examples
        run: |
          set -euo pipefail
          if [ "${{ matrix.mode }}" = debug ]; then
            export ASAN_OPTIONS="${ASAN_OPTIONS:+${ASAN_OPTIONS}:}symbolize=0"
          fi
          status=0
          shopt -s nullglob
          files=(examples/*.moxi)
          if [ "${#files[@]}" -eq 0 ]; then
            echo "error: no examples/*.moxi files found"
            exit 1
          fi
          export LD_LIBRARY_PATH="${PWD}/build${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}"
          for f in "${files[@]}"; do
            echo "==> $f"
            if ./examples/echo "$f"; then
              echo "[PASS] $f"
            else
              echo "[FAIL] $f"
              status=1
            fi
          done
          exit "$status"
