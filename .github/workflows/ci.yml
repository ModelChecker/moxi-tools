# This file was generated by Cursor AI on 2026-10-20.
name: CI

on:
  push:
  pull_request:

permissions:
  contents: read
  actions: write

jobs:
  test:
    name: Build and test
    runs-on: ubuntu-latest
    env:
      YICES_VERSION: "2.7.0"
      YICES_PREFIX: ${{ github.workspace }}/.yices
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Cache Yices
        id: cache-yices
        uses: actions/cache@v4
        with:
          path: ${{ env.YICES_PREFIX }}
          key: yices-${{ env.YICES_VERSION }}-${{ runner.os }}-${{ runner.arch }}

      - name: Install Yices
        if: steps.cache-yices.outputs.cache-hit != 'true'
        run: |
          curl -fsSL -o yices.tar.gz \
            https://github.com/SRI-CSL/yices2/releases/download/yices-${YICES_VERSION}/yices-${YICES_VERSION}-x86_64-pc-linux-gnu-static-gmp.tar.gz
          tar -xzf yices.tar.gz
          ./yices-${YICES_VERSION}/install-yices "$YICES_PREFIX"
          rm -rf yices.tar.gz "yices-${YICES_VERSION}"

      - name: Configure Yices environment
        run: |
          echo "$YICES_PREFIX/bin" >> "$GITHUB_PATH"
          echo "C_INCLUDE_PATH=$YICES_PREFIX/include" >> "$GITHUB_ENV"
          echo "LIBRARY_PATH=$YICES_PREFIX/lib" >> "$GITHUB_ENV"
          echo "LD_LIBRARY_PATH=$YICES_PREFIX/lib" >> "$GITHUB_ENV"
          echo "LDFLAGS=-L$YICES_PREFIX/lib -Wl,-rpath,$YICES_PREFIX/lib" >> "$GITHUB_ENV"

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang gperf python3

      - name: Build
        run: make -j"$(nproc)"

      - name: Run test suite
        run: python3 test/test.py

      - name: Build echo example
        run: |
          clang -std=c99 -Wall \
            -Ibuild -I"$YICES_PREFIX/include" examples/echo.c \
            -Lbuild -L"$YICES_PREFIX/lib" -lmoxiparser -lyices \
            -Wl,-rpath,"$PWD/build" -Wl,-rpath,"$YICES_PREFIX/lib" \
            -o examples/echo

      - name: Run echo on examples
        run: |
          set -euo pipefail
          status=0
          shopt -s nullglob
          files=(examples/*.moxi)
          if [ "${#files[@]}" -eq 0 ]; then
            echo "error: no examples/*.moxi files found"
            exit 1
          fi
          export LD_LIBRARY_PATH="${PWD}/build${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}"
          for f in "${files[@]}"; do
            echo "==> $f"
            if ./examples/echo "$f"; then
              echo "[PASS] $f"
            else
              echo "[FAIL] $f"
              status=1
            fi
          done
          exit "$status"
